[package]
name = "gh-flake-detector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
futures-util = "0.3"
indicatif = "0.17"
octocrab = { version = "0.44.1", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
term_size = "0.3"
tokio = { version = "1.36", features = ["full"] }
